# Static collection template. Replace the domain and root for your environment.
server {
    listen 80;
    listen [::]:80;
    server_name demos.example.com;
    root /var/www/gpt6-astra-demos/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location ~ \.html$ {
        expires -1;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
