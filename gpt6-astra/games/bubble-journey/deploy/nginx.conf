# Copy as a dedicated virtual host; replace server_name and root for your environment.
server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;
    root /var/www/bubble-journey/current;
    index index.html;

    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;

    location = /index.html {
        expires -1;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\.(?!well-known/) {
        deny all;
    }
}
